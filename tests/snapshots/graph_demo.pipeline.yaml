lasagna: "3.0"
id: demo
name: "Graph demo"
description: "Fixture for lasagna graph."
params:
  x: { default: "green" }
entry: plan
nodes:
  - id: plan
    description: "Plan the work."
  - id: review
    name: 'Say "hi" [now]'
    description: "Human review."
    started_by: human
    gate: { type: human, message: "OK?" }
  - id: build
    name: "Build"
    description: "Build it."
    gate: { type: check, run: "pytest" }
  - id: judge
    name: "Judge"
    description: "Judge it."
    gate: { type: agent, criteria: ["ok"] }
  - id: done
    name: "Done"
    description: "Finish."
edges:
  - { type: direct, from: plan, to: review }
  - { type: direct, from: review, to: build }
  - { type: loop, from: build, to: plan, max_iterations: 3 }
  - { type: loop, from: judge, to: build, when: "{{ params.x }} again", max_iterations: 2 }
  - type: router
    from: build
    decided_by: agent
    routes:
      - { to: judge, when: "ready" }
    default: done
  - type: router
    from: judge
    decided_by: check
    routes:
      - { to: done, run: "test -f ok" }
