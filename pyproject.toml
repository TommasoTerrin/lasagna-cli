[project]
name = "lasagna-cli"
version = "0.1.0"
description = "Orchestrate pipelines whose phases are run by humans, machines or AI agents."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.30",
]

[project.scripts]
lasagna = "lasagna_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
