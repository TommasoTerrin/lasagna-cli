name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        shell: bash
        run: uv sync --locked --python 3.11
      - name: Lint
        shell: bash
        run: uv run ruff check .
      - name: Format check
        shell: bash
        run: uv run ruff format --check .
      - name: Tests
        shell: bash
        run: uv run pytest
